# Set the project type
# Allowed values:
#   - ddev: default, only need to define extra services
#   - custom: for projects that don't use ddev, need to define services
#   - storybook: use with storybook, need to define services
type: custom

# The directory that commands should be run from, relative to the project root.
# When using ddev this directory should also contain .ddev
working_dir: ./

# The name of the ip whitelist that should be used for the project.
# For more info on ip lists see https://bitbucket.org/fenomen/pipeline/src/master/
ip_list: ken

# List of directories that should be excluded from the rsync process.
# The rsync process also deletes anything not present in the repository so
# if you manually create a file and want to keep it you should add it to this list.
rsync_exclude:
  - /.env

# Commands run in the working directory after the project has been deployed.
post_deploy:
  - echo "Project deployed"

# Define project services that you need external access to.
# For ddev projects you only need to add extra containers that you've added, the default web container is predefined.
#
# You can use any name you want for the service, but it should be unique for the project.
# If you set the service name as main it will be considered the main container of the
# project and is accessible at <project-instance>.fusion.adm.ee (without a service name prefix) do not use this with
# ddev since for ddev projects the web container is already considered the main container.
#
# The container name shouldn't include the folder prefix added by ddev or docker compose. So if you have the following
# container my_project-my-container-1 you should only use my-container-1 as the container name.
# For ddev projects since they also prepend ddev, if the container is ddev-my_project-my-container you should only use
# my-container as the container name.
# That is because the folder name and thus the prefix is not constant between environments and instances.
#
services:
  uwezo:
    port: 8080
    container: uwezo-1
