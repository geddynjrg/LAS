openapi: 3.0.1
info:
  title: TVET - REST API
  description: The REST API provide by the core REST module.
  version: Versioning not supported
servers:
- url: https://tvet-api-qa.fusion.adm.ee/
security:
- basic_auth: []
- csrf_token: []
tags:
- name: node
  description: "Entity type: Content"
  x-entity-type: node
  x-definition:
    $ref: '#/definitions/node'
paths:
  /api/v1/courses:
    get:
      summary: Course List Resource
      operationId: course_list_resource:GET
      parameters:
      - name: _format
        in: query
        description: Request format
        required: true
        schema:
          type: string
          default: json
          enum:
          - json
      responses:
        "200":
          description: successful operation
          content: {}
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad data
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.
      security:
      - cookie: []
  /node/{node}:
    get:
      tags:
      - node
      summary: Get a Content
      operationId: entity:node:GET
      parameters:
      - name: _format
        in: query
        description: Request format
        required: true
        schema:
          type: string
          default: json
          enum:
          - json
      - name: node
        in: path
        description: "The nid,id, of the node."
        required: true
        schema:
          type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/node'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad data
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.
      security:
      - basic_auth: []
      - csrf_token: []
    delete:
      tags:
      - node
      summary: Delete a Content
      operationId: entity:node:DELETE
      parameters:
      - name: _format
        in: query
        description: Request format
        required: true
        schema:
          type: string
          default: json
          enum:
          - json
      - name: node
        in: path
        description: "The nid,id, of the node."
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Entity deleted
          content: {}
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad data
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.
      security:
      - basic_auth: []
      - csrf_token: []
    patch:
      tags:
      - node
      summary: Patch a Content
      operationId: entity:node:PATCH
      parameters:
      - name: _format
        in: query
        description: Request format
        required: true
        schema:
          type: string
          default: json
          enum:
          - json
      - name: node
        in: path
        description: "The nid,id, of the node."
        required: true
        schema:
          type: string
      requestBody:
        description: The Content object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/node'
        required: true
      responses:
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad data
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.
      security:
      - basic_auth: []
      - csrf_token: []
      x-codegen-request-body-name: body
  /node:
    post:
      tags:
      - node
      summary: Post a Content
      operationId: entity:node:POST
      parameters:
      - name: _format
        in: query
        description: Request format
        required: true
        schema:
          type: string
          default: json
          enum:
          - json
      requestBody:
        description: The Content object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/node'
        required: true
      responses:
        "201":
          description: Entity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/node'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad data
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.
      security:
      - basic_auth: []
      - csrf_token: []
      x-codegen-request-body-name: body
  /api/v1/node/{id}:
    get:
      summary: TVET Node Resource
      operationId: tvet_node_resource:GET
      parameters:
      - name: _format
        in: query
        description: Request format
        required: true
        schema:
          type: string
          default: json
          enum:
          - json
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: successful operation
          content: {}
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad data
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.
      security:
      - cookie: []
  /api/v1/resolve:
    get:
      summary: TVET Path Resource
      operationId: tvet_path_resource:GET
      parameters:
      - name: _format
        in: query
        description: Request format
        required: true
        schema:
          type: string
          default: json
          enum:
          - json
      responses:
        "200":
          description: successful operation
          content: {}
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad data
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.
      security:
      - cookie: []
components:
  schemas:
    node:
      title: node Schema
      required:
      - title
      - type
      type: object
      properties:
        nid:
          title: ID
          maxItems: 1
          type: array
          items:
            title: Number (integer)
            required:
            - value
            type: object
            properties:
              value:
                title: Integer value
                type: integer
        uuid:
          title: UUID
          maxItems: 1
          type: array
          items:
            title: UUID
            required:
            - value
            type: object
            properties:
              value:
                title: Text value
                maxLength: 128
                type: string
        vid:
          title: Revision ID
          maxItems: 1
          type: array
          items:
            title: Number (integer)
            required:
            - value
            type: object
            properties:
              value:
                title: Integer value
                type: integer
        langcode:
          title: Language
          maxItems: 1
          type: array
          items:
            title: Language
            required:
            - value
            type: object
            properties:
              value:
                title: Language code
                type: string
        type:
          title: Content type
          maxItems: 1
          minItems: 1
          type: array
          items:
            title: Entity reference
            required:
            - target_id
            type: object
            properties:
              target_id:
                title: Content type ID
                type: string
        revision_timestamp:
          title: Revision create time
          maxItems: 1
          type: array
          description: The time that the current revision was created.
          items:
            title: Created
            required:
            - value
            type: object
            properties:
              value:
                title: Timestamp value
                type: number
                format: utc-millisec
        revision_uid:
          title: Revision user
          maxItems: 1
          type: array
          description: The user ID of the author of the current revision.
          items:
            title: User
            required:
            - target_id
            type: object
            properties:
              target_id:
                title: User ID
                type: integer
            description: The referenced entity
        revision_log:
          title: Revision log message
          maxItems: 1
          type: array
          description: Briefly describe the changes you have made.
          items:
            title: "Text (plain, long)"
            required:
            - value
            type: object
            properties:
              value:
                title: Text value
                type: string
        status:
          title: Published
          maxItems: 1
          type: array
          items:
            title: Boolean
            required:
            - value
            type: object
            properties:
              value:
                title: Boolean value
                type: boolean
        uid:
          title: Authored by
          maxItems: 1
          type: array
          description: The username of the content author.
          items:
            title: User
            required:
            - target_id
            type: object
            properties:
              target_id:
                title: User ID
                type: integer
            description: The referenced entity
        title:
          title: Title
          maxItems: 1
          minItems: 1
          type: array
          items:
            title: Text (plain)
            required:
            - value
            type: object
            properties:
              value:
                title: Text value
                maxLength: 255
                type: string
        created:
          title: Authored on
          maxItems: 1
          type: array
          description: The date and time that the content was created.
          items:
            title: Created
            required:
            - value
            type: object
            properties:
              value:
                title: Timestamp value
                type: number
                format: utc-millisec
        changed:
          title: Changed
          maxItems: 1
          type: array
          description: The time that the node was last edited.
          items:
            title: Last changed
            required:
            - value
            type: object
            properties:
              value:
                title: Timestamp value
                type: number
                format: utc-millisec
        promote:
          title: Promoted to front page
          maxItems: 1
          type: array
          items:
            title: Boolean
            required:
            - value
            type: object
            properties:
              value:
                title: Boolean value
                type: boolean
        sticky:
          title: Sticky at top of lists
          maxItems: 1
          type: array
          items:
            title: Boolean
            required:
            - value
            type: object
            properties:
              value:
                title: Boolean value
                type: boolean
        default_langcode:
          title: Default translation
          maxItems: 1
          type: array
          description: A flag indicating whether this is the default translation.
          items:
            title: Boolean
            required:
            - value
            type: object
            properties:
              value:
                title: Boolean value
                type: boolean
        revision_default:
          title: Default revision
          maxItems: 1
          type: array
          description: A flag indicating whether this was a default revision when
            it was saved.
          items:
            title: Boolean
            required:
            - value
            type: object
            properties:
              value:
                title: Boolean value
                type: boolean
        revision_translation_affected:
          title: Revision translation affected
          maxItems: 1
          type: array
          description: Indicates if the last edit of a translation belongs to current
            revision.
          items:
            title: Boolean
            required:
            - value
            type: object
            properties:
              value:
                title: Boolean value
                type: boolean
        path:
          title: URL alias
          maxItems: 1
          type: array
          items:
            title: Path
            type: object
            properties:
              alias:
                title: Path alias
                type: string
              pid:
                title: Path id
                type: integer
              langcode:
                title: Language Code
                type: string
              pathauto:
                title: Pathauto state
                type: integer
                description: Whether an automated alias should be created or not.
        menu_link:
          title: Menu link
          maxItems: 1
          type: array
          description: Computed menu link for the node (only available during node
            saving).
          items:
            title: Custom menu link
            required:
            - target_id
            type: object
            properties:
              target_id:
                title: Custom menu link ID
                type: integer
            description: The referenced entity
        content_translation_source:
          title: Translation source
          maxItems: 1
          type: array
          description: The source language from which this translation was created.
          items:
            title: Language
            required:
            - value
            type: object
            properties:
              value:
                title: Language code
                type: string
        content_translation_outdated:
          title: Translation outdated
          maxItems: 1
          type: array
          description: A boolean indicating whether this translation needs to be updated.
          items:
            title: Boolean
            required:
            - value
            type: object
            properties:
              value:
                title: Boolean value
                type: boolean
      description: Describes the payload for 'node' entities.
      discriminator:
        propertyName: type
    node:course:
      allOf:
      - $ref: '#/components/schemas/node'
      - title: node:course Schema
        type: object
        properties:
          field_application_fee:
            title: Application fee
            maxItems: 1
            type: array
            items:
              title: Number (decimal)
              type: object
              properties: {}
          field_apply_till:
            title: Apply Till
            maxItems: 1
            type: array
            items:
              title: Date
              required:
              - value
              type: object
              properties:
                value:
                  title: Date value
                  type: string
                  format: date
          field_course_fee:
            title: Course fee
            maxItems: 1
            type: array
            items:
              title: Number (decimal)
              type: object
              properties: {}
          field_duration:
            title: Duration
            maxItems: 1
            type: array
            items:
              title: Number (integer)
              required:
              - value
              type: object
              properties:
                value:
                  title: Integer value
                  type: integer
          field_education_level:
            title: Education level
            type: array
            items:
              title: Taxonomy term
              required:
              - target_id
              type: object
              properties:
                target_id:
                  title: Taxonomy term ID
                  type: integer
              description: The referenced entity
          field_image:
            title: Image
            maxItems: 1
            type: array
            items:
              title: Media
              required:
              - target_id
              type: object
              properties:
                target_id:
                  title: Media ID
                  type: integer
              description: The referenced entity
          field_institution:
            title: Institution
            maxItems: 1
            type: array
            items:
              title: Content
              required:
              - target_id
              type: object
              properties:
                target_id:
                  title: Content ID
                  type: integer
              description: The referenced entity
          field_page_components:
            title: Page components
            type: array
            items:
              title: Entity reference revisions
              required:
              - target_id
              - target_revision_id
              type: object
              properties:
                target_id:
                  title: Paragraph ID
                  type: integer
                target_revision_id:
                  title: Paragraph revision ID
                  type: integer
          field_start_on:
            title: Start on
            maxItems: 1
            type: array
            items:
              title: Date
              required:
              - value
              type: object
              properties:
                value:
                  title: Date value
                  type: string
                  format: date
          field_tags:
            title: Tags
            type: array
            items:
              title: Taxonomy term
              required:
              - target_id
              type: object
              properties:
                target_id:
                  title: Taxonomy term ID
                  type: integer
              description: The referenced entity
          field_test_booking_fee:
            title: Test booking fee
            maxItems: 1
            type: array
            items:
              title: Number (decimal)
              type: object
              properties: {}
        description: "Defines a course with structured fields for details, curriculum,\
          \ and related resources."
    node:institution:
      allOf:
      - $ref: '#/components/schemas/node'
      - title: node:institution Schema
        type: object
        properties:
          promote:
            title: Promoted to front page
            maxItems: 1
            type: array
            items:
              title: Boolean
              required:
              - value
              type: object
              properties:
                value:
                  title: Boolean value
                  type: boolean
          field_address:
            title: Address
            maxItems: 1
            type: array
            items:
              title: Address
              type: object
              properties:
                langcode:
                  title: The language code
                  type: string
                country_code:
                  title: The two-letter country code
                  type: string
                administrative_area:
                  title: The top-level administrative subdivision of the country
                  type: string
                locality:
                  title: The locality (i.e. city)
                  type: string
                dependent_locality:
                  title: The dependent locality (i.e. neighbourhood)
                  type: string
                postal_code:
                  title: The postal code
                  type: string
                sorting_code:
                  title: The sorting code
                  type: string
                address_line1:
                  title: The first line of the address block
                  type: string
                address_line2:
                  title: The second line of the address block
                  type: string
                address_line3:
                  title: The third line of the address block
                  type: string
                organization:
                  title: The organization
                  type: string
                given_name:
                  title: The given name
                  type: string
                additional_name:
                  title: The additional name
                  type: string
                family_name:
                  title: The family name
                  type: string
          field_body:
            title: Body
            maxItems: 1
            type: array
            items:
              title: "Text (formatted, long)"
              required:
              - value
              type: object
              properties:
                value:
                  title: Text
                  type: string
                format:
                  title: Text format
                  type: string
          field_contact_text:
            title: Text
            maxItems: 1
            type: array
            items:
              title: "Text (formatted, long)"
              required:
              - value
              type: object
              properties:
                value:
                  title: Text
                  type: string
                format:
                  title: Text format
                  type: string
          field_email:
            title: Email
            maxItems: 1
            type: array
            items:
              title: Email
              required:
              - value
              type: object
              properties:
                value:
                  title: Email
                  type: string
                  format: email
          field_image:
            title: Image
            maxItems: 1
            type: array
            items:
              title: Media
              required:
              - target_id
              type: object
              properties:
                target_id:
                  title: Media ID
                  type: integer
              description: The referenced entity
          field_location:
            title: Location
            maxItems: 1
            type: array
            items:
              title: Geofield
              type: object
              properties:
                value:
                  title: Geometry
                  type: string
                geo_type:
                  title: Geometry Type
                  type: string
                geohash:
                  title: Geohash
                  type: string
                latlon:
                  title: LatLong Pair
                  type: string
          field_page_components:
            title: Page components
            type: array
            items:
              title: Entity reference revisions
              required:
              - target_id
              - target_revision_id
              type: object
              properties:
                target_id:
                  title: Paragraph ID
                  type: integer
                target_revision_id:
                  title: Paragraph revision ID
                  type: integer
          field_phone:
            title: Phone
            maxItems: 1
            type: array
            items:
              title: Telephone number
              required:
              - value
              type: object
              properties:
                value:
                  title: Telephone number
                  type: string
        description: "Represents an institution with structured fields for details,\
          \ branding, and related content."
    node:landing:
      allOf:
      - $ref: '#/components/schemas/node'
      - title: node:landing Schema
        type: object
        properties:
          promote:
            title: Promoted to front page
            maxItems: 1
            type: array
            items:
              title: Boolean
              required:
              - value
              type: object
              properties:
                value:
                  title: Boolean value
                  type: boolean
          field_body:
            title: Body
            maxItems: 1
            type: array
            items:
              title: "Text (formatted, long)"
              required:
              - value
              type: object
              properties:
                value:
                  title: Text
                  type: string
                format:
                  title: Text format
                  type: string
          field_image:
            title: Image
            maxItems: 1
            type: array
            items:
              title: Media
              required:
              - target_id
              type: object
              properties:
                target_id:
                  title: Media ID
                  type: integer
              description: The referenced entity
          field_page_components:
            title: Page components
            type: array
            items:
              title: Entity reference revisions
              required:
              - target_id
              - target_revision_id
              type: object
              properties:
                target_id:
                  title: Paragraph ID
                  type: integer
                target_revision_id:
