  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
    csrf_token:
      type: apiKey
      name: X-CSRF-Token
      in: header
      x-tokenUrl: https://tvet-api-qa.fusion.adm.ee/session/token
x-original-swagger-version: "2.0"
