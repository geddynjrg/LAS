global:
  prefer_sms: true
  from_email: uwezo@adm.ee
  from_name: Uwezo
providers:
  email:
    enabled: true
    from_email: loans@uwezo.co.ke
    from_name: Uwezo
  email_admin:
    enabled: true
    from_email: admin@uwezo.co.ke
    from_name: 'Uwezo Admin'
  sms:
    enabled: true
status_notifications:
  unassigned:
    enabled: true
    recipient: admin
    admin_roles:
      - reviewer
    subject: 'New Application Requires Review'
    email_message: |
      New application submitted:
      ID: [application:application_id]
      Group: [application:group_name]
      View: [application:url]
    sms_message: 'New application [application:application_id] from [application:group_name] needs review'
  approved:
    enabled: true
    recipient: customer
    admin_roles: {  }
    subject: 'Loan Application Approved'
    email_message: "Congratulations! Your loan application [application:application_id] has been approved.\r\nAmount: [application:loan_amount]\r\n"
    sms_message: 'Good news! Your loan application [application:application_id] for [application:loan_amount] has been approved.'
  rejected:
    enabled: true
    recipient: customer
    admin_roles: {  }
    subject: 'Application Update'
    email_message: "Application [application:application_id] status update.\r\nReason: [application:rejection_reason]\r\n[application:rejection_message]\r\n"
    sms_message: 'Application [application:application_id] update. Reason: [application:rejection_reason]'
  draft:
    enabled: false
    recipient: customer
    admin_roles: {  }
    subject: ''
    email_message: ''
    sms_message: ''
  group_member_confirmation:
    enabled: false
    recipient: customer
    admin_roles: {  }
    subject: ''
    email_message: ''
    sms_message: ''
  submitted:
    enabled: false
    recipient: customer
    admin_roles: {  }
    subject: ''
    email_message: ''
    sms_message: ''
  approved_by_constituency:
    enabled: true
    recipient: customer
    admin_roles: {  }
    subject: 'Constituency Approval'
    email_message: "Your loan application [application:application_id] has passed constituency review and is proceeding to HQ.\r\n"
    sms_message: 'Your loan application [application:application_id] has passed constituency review.'
  constituency_review:
    enabled: true
    recipient: customer
    admin_roles: {  }
    subject: 'Application Under Review'
    email_message: "Your loan application [application:application_id] is under constituency review.\r\n"
    sms_message: 'Your loan application [application:application_id] is under review.'
  under_review:
    enabled: true
    recipient: customer
    admin_roles: {  }
    subject: 'Application Under HQ Review'
    email_message: "Your loan application [application:application_id] is now under HQ review.\r\n"
    sms_message: 'Your loan application [application:application_id] is now under HQ review.'
  training:
    enabled: true
    recipient: customer
    admin_roles: {  }
    subject: 'Uwezo Fund Training Scheduled'
    email_message: "Your group loan application [application:application_id] ([application:group_name]) has been scheduled for mandatory training.\r\n\r\n[status_change:notes]\r\n"
    sms_message: 'Uwezo Fund training for [application:application_id] ([application:group_name]). [status_change:notes]'
  pending_secretariat_review:
    enabled: false
    recipient: customer
    admin_roles: {  }
    subject: ''
    email_message: ''
    sms_message: ''
  pending_fund_transfer:
    enabled: false
    recipient: customer
    admin_roles: {  }
    subject: ''
    email_message: ''
    sms_message: ''
  pending_final_disbursement:
    enabled: true
    recipient: customer
    admin_roles: {  }
    subject: 'Ready for Disbursement'
    email_message: "Your loan application [application:application_id] has completed training and is awaiting final disbursement authorization.\r\n"
    sms_message: 'Application [application:application_id] completed training and awaits disbursement.'
  disbursement_failed:
    enabled: true
    recipient: customer
    admin_roles: {  }
    subject: 'Disbursement Update'
    email_message: "Your loan application [application:application_id] disbursement could not be completed. Reason: [application:rejection_message]\r\nPlease contact your constituency office.\r\n"
    sms_message: 'Application [application:application_id]: disbursement was not completed. [application:rejection_message] Contact your constituency office.'
  disbursed:
    enabled: true
    recipient: customer
    admin_roles: {  }
    subject: 'Loan Disbursed'
    email_message: "Your loan for application [application:application_id] has been disbursed.\r\n"
    sms_message: 'Your loan application [application:application_id] has been disbursed.'
  closed:
    enabled: false
    recipient: customer
    admin_roles: {  }
    subject: ''
    email_message: ''
    sms_message: ''
