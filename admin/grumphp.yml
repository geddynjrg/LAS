    #     '/config',
    #     '/drush',
    #     '/web/robots.txt',
    #     'bower_components',
    #     'node_modules',
    #     '/vendor'
    #   ]
    #   triggered_by: [php, module, theme, inc]
    #   memory_limit: '-1'
    #   use_grumphp_paths: true
    twigcs:
      path: .
      severity: warning
      display: all
      ruleset: FriendsOfTwig\Twigcs\Ruleset\Official
      triggered_by: [twig]
      exclude: ['#web/core#', '#web/modules/contrib#', '#web/themes/contrib#', '#web/libraries#']
    twigcsfixer:
      paths: []
      level: null
      config: null
      report: text
      no-cache: true
      verbose: false
      triggered_by: [twig]
    yamllint:
      whitelist_patterns:
        - '/^web\/modules\/custom\/.+\.(yml|yaml)$/'
      ignore_patterns: ['#/tests#']
      object_support: false
      exception_on_invalid_type: false
      parse_constant: false
      parse_custom_tags: false
    # jsonlint:
    #   ignore_patterns: ['#/tests#']
    #   detect_key_conflicts: true
    securitychecker_enlightn:
      lockfile: composer.lock
      run_always: true
