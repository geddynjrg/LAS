grumphp:
  hide_circumvention_tip: true
  process_timeout: 170
  stop_on_failure: false
  ignore_unstaged_changes: false
  fixer:
    enabled: true
  git_hook_variables:
    EXEC_GRUMPHP_COMMAND: 'vendor/bin/grumphp'
  hooks_dir: null  # Disable GrumPHP git hooks - managed by Husky
  ascii:
    failed: web/modules/contrib/clean_code/ascii/failed.txt
    succeeded: web/modules/contrib/clean_code/ascii/succeeded.txt
  tasks:
    git_blacklist:
      keywords: ['\bdie\(', '\bvar_dump\(', '\bexit;', '\bdd\(', '\bkint\(', '\bprint_r\(', '\bdebug\(']
      whitelist_patterns:
        - '/^web\/modules\/custom\/.+\.(php|module|inc|install|test|profile|theme)$/'
        - '/^admin\/web\/modules\/custom\/.+\.(php|module|inc|install|test|profile|theme)$/'
      triggered_by: [php, module, theme, inc, phtml, php3, php4, php5]
      regexp_type: E
      match_word: false
      ignore_patterns: ['#/tests#']
    git_branch_name:
      whitelist: ['/^(feat|fix|refactor|style|test|docs|build|ops|chore)\/([A-Z0-9\-]+)\/([a-zA-Z0-9\-]+)$/']
      blacklist: [master, develop, production, staging]
      allow_detached_head: false
    git_commit_message:
      allow_empty_message: false
      enforce_capitalized_subject: false
      enforce_no_subject_punctuations: true
      enforce_no_subject_trailing_period: true
      enforce_single_lined_subject: true
      max_body_width: 72
      max_subject_width: 60
      matchers: ['/^(feat|fix|refactor|style|test|docs|build|ops|chore)\([A-Z0-9_-]+\): [a-zA-Z0-9 _()\-]+$|^Merge branch .+$|^Revert \\"[^\\"]+\\"$/']
      case_insensitive: false
      multiline: true
      skip_on_merge_commit: true
    phpcs:
      standard: [Drupal, DrupalPractice]
      severity: 5
      error_severity: 5
      warning_severity: 5
      tab_width: null
      report: full
      report_width: 80
      whitelist_patterns:
        - '/^web\/modules\/custom\/.+\.(php|module|inc|install|test|profile|theme)$/'
      encoding: utf-8
      ignore_patterns: [
        '#/tests#',
        '/web/sites/default/default.settings.php',
        '/web/sites/default/settings.php',
        '/web/sites/default/settings.*.php'
      ]
      sniffs: []
      triggered_by: [php, module, theme, inc, phtml, php3, php4, php5]
      exclude: []
      show_sniffs_error_path: true
    phplint:
      exclude: []
      jobs: 4
      short_open_tag: true
      ignore_patterns: [
        '#/tests#',
        '/web/sites/default/default.settings.php',
        '/web/sites/default/settings.php',
        '/web/sites/default/settings.*.php'
      ]
      triggered_by: [php, module, theme, inc, phtml, php3, php4, php5]
    # phpmd:
    #   whitelist_patterns:
    #     - '/^web\/modules\/custom\/.+\.(php|module|inc|install|test|profile|theme)$/'
    #   exclude: [
    #     'tests/*',
    #     'web/sites/default/default.settings.php',
    #     'web/sites/default/settings.php',
    #     'web/sites/default/settings.*.php'
    #   ]
    #   report_format: text
    #   ruleset: [cleancode, codesize, naming, controversial, design, unusedcode]
    #   triggered_by: [php, module, theme, inc]
    # phpstan:
    #   autoload_file: null
    #   configuration: phpstan.neon
    #   level: 4
    #   force_patterns: []
    #   ignore_patterns: [
    #     '#/tests#',
    #     '.github',
