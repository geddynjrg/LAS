api_content.settings:
  type: config_object
  label: 'API Content settings'
  mapping:
    contact_info:
      type: mapping
      label: 'Contact Information'
      mapping:
        address:
          type: string
          label: 'Address'
        po_box:
          type: string
          label: 'P.O. Box'
        phone:
          type: string
          label: 'Phone'
        email:
          type: email
          label: 'Email' 