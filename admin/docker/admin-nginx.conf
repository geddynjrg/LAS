user www-data;
worker_processes auto;
error_log /dev/stderr;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-js text/x-cross-domain-policy application/x-font-ttf 
               application/x-font-opentype application/vnd.ms-fontobject 
               image/x-icon;

    map $http_x_forwarded_proto $uwz_https_flag {
        default off;
        https on;
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html/web;
        index index.php;

        # Request size limits (applications with many member ID photos can exceed 60MB)
        client_max_body_size 128M;
        client_body_buffer_size 1M;

        # Static asset caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            try_files $uri =404;
        }

        # Block access to sensitive files
        location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|^(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config)$|^#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
            deny all;
            return 404;
        }

        # Allow "Well-Known URIs" as per RFC 5785
        location ~* ^/.well-known/ {
            allow all;
        }

        # Block access to "hidden" files and directories
        location ~ (^|/)\. {
            return 403;
        }

        # Drupal files directory
        location ~ ^/sites/.*/files/ {
            expires 1M;
            add_header Cache-Control "public";
            try_files $uri @drupal_rewrite;
        }

        # Handle PHP files
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
            try_files $fastcgi_script_name =404;
            
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            
            # FastCGI optimizations
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_connect_timeout 120s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;
            
            # Security
            fastcgi_param HTTP_PROXY "";
            fastcgi_intercept_errors on;
            
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $uwz_https_flag;
            fastcgi_param REQUEST_SCHEME $http_x_forwarded_proto;
        }

        # Modern Drupal rewrite rules
        location @drupal_rewrite {
            rewrite ^/(.*)$ /index.php/$1;
        }

        # Main location with clean URLs
        location / {
            try_files $uri /index.php?$query_string;
        }

        # Image styles handling
        location ~ ^/sites/.*/files/styles/ {
            expires 1M;
            add_header Cache-Control "public";
            try_files $uri @drupal_rewrite;
        }

        # Handle private files through Drupal
        location ~ ^(/[a-z\-]+)?/system/files/ {
            try_files $uri /index.php?$query_string;
        }

        # API endpoints and admin paths
        location ~ ^/(admin|user|node/add|api) {
            try_files $uri /index.php?$query_string;
        }

        # Enforce clean URLs for language prefixes
        location ~ ^/[a-z\-]+$ {
            try_files $uri /index.php?$query_string;
        }

        # Health check endpoint
        location = /healthz {
            access_log off;
            try_files $uri /index.php?$query_string;
        }
    }
}