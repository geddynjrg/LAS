name: Deploy to Staging

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: Generate .env file
        env:
          # Secrets
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          HASH_SALT: ${{ secrets.HASH_SALT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          EBISCLOUD_SMS_API_KEY: ${{ secrets.EBISCLOUD_SMS_API_KEY }}
          # Environment variables
          EBISCLOUD_SMS_API_URL: ${{ vars.EBISCLOUD_SMS_API_URL || 'https://api.ebiscloud.com/v1/sms/send' }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN || 'localhost' }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN || 'admin.localhost' }}
          HTTP_PORT: ${{ vars.HTTP_PORT || '80' }}
          HTTPS_PORT: ${{ vars.HTTPS_PORT || '443' }}
        run: |
          cat > .env << EOF
          DB_NAME=drupal
          DB_USER=drupal
          DB_PASSWORD=${DB_PASSWORD}
          DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
          HASH_SALT=${HASH_SALT}
          JWT_SECRET=${JWT_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          EBISCLOUD_SMS_API_KEY=${EBISCLOUD_SMS_API_KEY}
          EBISCLOUD_SMS_API_URL=${EBISCLOUD_SMS_API_URL}
          HTTP_PORT=${HTTP_PORT}
          HTTPS_PORT=${HTTPS_PORT}
          WEB_DOMAIN=${WEB_DOMAIN}
          ADMIN_DOMAIN=${ADMIN_DOMAIN}
          EOF
          
      - name: Build images
        env:
          COMPOSE_PROJECT_NAME: uwezo
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh staging --step build
          
      - name: Deploy application
        env:
          COMPOSE_PROJECT_NAME: uwezo
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ./scripts/deploy.sh staging --step deploy
          
      - name: Run post-deployment tasks
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ./scripts/deploy.sh staging --step post-deploy