name: uwezo

services:
  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
      args:
        - NODE_VERSION=20
        - PROJECT=web
        - DATABASE_URL=mysql://${DB_USER:-drupal}:${DB_PASSWORD}@db:3306/web
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://${WEB_DOMAIN:-localhost}}
        - NEXT_PUBLIC_ADMIN_DOMAIN=https://${ADMIN_DOMAIN:-admin.localhost}
        - NEXT_PUBLIC_API_URL=https://${ADMIN_DOMAIN:-admin.localhost}
    environment:
      - NODE_ENV=${NODE_ENV:-${DRUPAL_ENV:-production}}
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-}
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-}
      - DATABASE_URL=mysql://${DB_USER:-drupal}:${DB_PASSWORD}@db:3306/web
      - NEXT_PUBLIC_ADMIN_DOMAIN=https://${ADMIN_DOMAIN}
      # Server-side sync uses internal Docker services (avoids nginx/IP whitelist + hairpin NAT)
      - API_URL=http://admin
      - LMS_API_URL=${LMS_INTERNAL_API_URL:-http://uwezo-lms-app}
      - LMS_API_HOST=${LMS_API_HOST:-lms-staging.uwezo.go.ke}
      - LMS_API_KEY=${LMS_API_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - API_FETCH_TIMEOUT_MS=${API_FETCH_TIMEOUT_MS:-60000}
      - UPLOAD_DIR=/app/web/uploads
      - MAX_FILE_SIZE=31457280
      - PESAFLOW_CHECKOUT_URL=${PESAFLOW_CHECKOUT_URL:-}
      - PESAFLOW_STATUS_URL=${PESAFLOW_STATUS_URL:-}
      - PESAFLOW_API_CLIENT_ID=${PESAFLOW_API_CLIENT_ID:-}
      - PESAFLOW_SERVICE_ID=${PESAFLOW_SERVICE_ID:-}
      - PESAFLOW_HMAC_KEY=${PESAFLOW_HMAC_KEY:-}
      - PESAFLOW_HMAC_SECRET=${PESAFLOW_HMAC_SECRET:-}
      - PESAFLOW_BILL_DESC=${PESAFLOW_BILL_DESC:-Uwezo Fund Repayment}
      - PESAFLOW_SEND_STK=${PESAFLOW_SEND_STK:-false}
      - PESAFLOW_CALLBACK_SECRET=${PESAFLOW_CALLBACK_SECRET:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://${WEB_DOMAIN:-localhost}}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY:-}
      - APP_PUSH_WEBHOOK_SECRET=${APP_PUSH_WEBHOOK_SECRET:-${EXTERNAL_API_KEY}}
      - APP_PUSH_STORE_PATH=/app/web/uploads/app-push.json
      - QR_LOGIN_ENABLED_UNTIL=indefinite
      - NEXT_PUBLIC_QR_LOGIN_ENABLED_UNTIL=indefinite

    env_file:
      - .env
    volumes:
      - web_uploads:/app/web/uploads
      - ${MKCERT_CA_PATH:-/dev/null}:/tmp/mkcert-ca.pem:ro
    extra_hosts:
      - "${ADMIN_DOMAIN:-admin.localhost}:host-gateway"
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - lms
    depends_on:
      admin:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - PHP_VERSION=8.3
    restart: unless-stopped
    volumes:
      - drupal_files:/var/www/html/web/sites/default/files
      - drupal_private:/var/www/private
    environment:
      # Database configuration
      DRUPAL_DATABASE_HOST: db
      DRUPAL_DATABASE_NAME: ${DB_NAME:-drupal}
      DRUPAL_DATABASE_USER: ${DB_USER:-drupal}
      DRUPAL_DATABASE_PASSWORD: ${DB_PASSWORD}
      DRUPAL_DATABASE_PORT: 3306
      # Application configuration
      DRUPAL_HASH_SALT: ${HASH_SALT}
      DRUPAL_ENV: ${DRUPAL_ENV:-production}
      # JWT configuration for API authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Frontend URL for CORS
      UWEZO_UI_PUBLIC_URL: https://${WEB_DOMAIN:-localhost}
      # EbisCloud SMS configuration
      EBISCLOUD_SMS_API_KEY: ${EBISCLOUD_SMS_API_KEY:-}
      EBISCLOUD_SMS_API_URL: ${EBISCLOUD_SMS_API_URL:-}
      EBISCLOUD_SMS_SHORTCODE: ${EBISCLOUD_SMS_SHORTCODE:-}
      EBISCLOUD_SMS_SERVICE_ID: ${EBISCLOUD_SMS_SERVICE_ID:-0}
      # Ecitizen config
      ECITIZEN_CLIENT_ID: ${ECITIZEN_CLIENT_ID}
      ECITIZEN_CLIENT_SECRET: ${ECITIZEN_CLIENT_SECRET}
      ECITIZEN_AUTH_URL: ${ECITIZEN_AUTH_URL}
      ECITIZEN_TOKEN_URL: ${ECITIZEN_TOKEN_URL}
      ECITIZEN_USER_INFO_URL: ${ECITIZEN_USER_INFO_URL}
      ECITIZEN_REDIRECT_URI: https://${ADMIN_DOMAIN}/api/oauth/ecitizen
      # SMTP configuration
      SMTP_HOST: ${SMTP_HOST:-${PROD_SMTP_HOST}}
      SMTP_PORT: ${SMTP_PORT:-${PROD_SMTP_PORT}}
      SMTP_USER: ${SMTP_USER:-${PROD_SMTP_USER}}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-${PROD_SMTP_PASSWORD}}
      APP_PUSH_NOTIFY_URL: ${APP_PUSH_NOTIFY_URL:-http://web:3000/api/auth/app/notify}
      APP_PUSH_WEBHOOK_SECRET: ${APP_PUSH_WEBHOOK_SECRET:-${EXTERNAL_API_KEY}}
      NEAMIS_CONSUMER_KEY: ${NEAMIS_CONSUMER_KEY:-}
      NEAMIS_CONSUMER_SECRET: ${NEAMIS_CONSUMER_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Database - MariaDB (meets Drupal 11 requirements)
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-drupal}
      MYSQL_USER: ${DB_USER:-drupal}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Web Server - Nginx (shared for both web and admin)
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certbot_www:/var/www/certbot:rw
      - /home/administrator/ssl/uwezo.go.ke:/etc/nginx/ssl:ro
      - /home/administrator/loan_app_staging/live_fix.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      - WEB_DOMAIN=${WEB_DOMAIN:-localhost}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.localhost}
      - LMS_DOMAIN=${LMS_DOMAIN:-lms-staging.uwezo.go.ke}
      - WEB_ALLOWED_IPS=${WEB_ALLOWED_IPS:-}
      - ADMIN_ALLOWED_IPS=${ADMIN_ALLOWED_IPS:-}
      - LMS_ALLOWED_IPS=${LMS_ALLOWED_IPS:-}
    depends_on:
      - admin
      - web

  # Processes sync_queue → Drupal admin → LMS on a schedule
  sync-worker:
    image: curlimages/curl:8.5.0
    restart: unless-stopped
    environment:
      - APP_URL=http://web:3000
      - CRON_SECRET=${CRON_SECRET}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-5}
    volumes:
      - ./scripts/sync-applications-cron.sh:/sync-applications-cron.sh:ro
    entrypoint: ["/bin/sh", "/sync-applications-cron.sh"]
    depends_on:
      web:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  lms:
    external: true
    name: uwezo-network

volumes:
  db_data:
  drupal_files:
  drupal_private:
  certbot_www:
  certbot_conf:
  web_uploads: