version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: uwezo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: uwezo_applications
      MYSQL_USER: uwezo_user
      MYSQL_PASSWORD: uwezo_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: uwezo_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  # Uwezo Application
  uwezo:
    container_name: uwezo_app
    env_file: ./apps/uwezo/.env
    build:
      context: .
      dockerfile: ./apps/uwezo/Dockerfile
    restart: unless-stopped
    ports:
      - 8080
    environment:
      - DATABASE_URL=mysql://uwezo_user:uwezo_password@mysql:3306/uwezo_applications
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./apps/uwezo/uploads:/app/uploads

  # Documentation
  docs:
    container_name: uwezo_docs
    build:
      context: .
      dockerfile: ./apps/docs/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:80"

# Volumes
volumes:
  mysql_data:
    driver: local
