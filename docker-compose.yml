version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: uwezo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: uwezo_applications
      MYSQL_USER: uwezo_user
      MYSQL_PASSWORD: uwezo_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: uwezo_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  # Uwezo Application
  uwezo:
    container_name: uwezo_app
    build:
      context: .
      dockerfile: ./apps/uwezo/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: mysql://uwezo_user:uwezo_password@mysql:3306/uwezo_applications
      NODE_ENV: production
      UPLOAD_DIR: "./public/uploads"
      MAX_FILE_SIZE: "10485760"
      EXTERNAL_API_KEY: "0eb29f8d-7dcc-48b2-aae9-1d21eeae3f4a"
      # Cron configuration
      CRON_SECRET: "0eb29f8d-7dcc-48b2-aae9-1d21eeae3f4a"
      NEXT_PUBLIC_API_BASE_URL: "https://uwezo-api-qa.fusion.adm.ee"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - /mnt/qa/www/uwezo_e-services-fe-qa/apps/uwezo/public/uploads:/app/public/uploads

  # Queue Worker Service
  queue-worker:
    container_name: uwezo_queue_worker
    build:
      context: .
      dockerfile: ./apps/uwezo/Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://uwezo_user:uwezo_password@mysql:3306/uwezo_applications
      NODE_ENV: production
      CRON_SECRET: "0eb29f8d-7dcc-48b2-aae9-1d21eeae3f4a"
      NEXT_PUBLIC_API_BASE_URL: "https://uwezo-api-qa.fusion.adm.ee"
      EXTERNAL_API_KEY: "0eb29f8d-7dcc-48b2-aae9-1d21eeae3f4a"
      # Worker specific settings
      WORKER_ENABLED: "true"
      SYNC_INTERVAL_MINUTES: "5"
      WORKER_MODE: "nodejs"
    depends_on:
      mysql:
        condition: service_healthy
      uwezo:
        condition: service_started
    volumes:
      - ./logs:/app/logs

  # Documentation
  docs:
    container_name: uwezo_docs
    build:
      context: .
      dockerfile: ./apps/docs/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:80"

# Volumes
volumes:
  mysql_data:
    driver: local
