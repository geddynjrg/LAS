api_auth.settings:
  type: config_object
  label: 'API Auth settings'
  mapping:
    jwt_secret:
      type: string
      label: 'JWT Secret Key'
    jwt_refresh_secret:
      type: string
      label: 'JWT Refresh Secret Key'
    jwt_expiration:
      type: integer
      label: 'JWT Access Token Expiration Time'
    jwt_refresh_expiration:
      type: integer
      label: 'JWT Refresh Token Expiration Time'
    jwt_auth_enabled:
      type: boolean
      label: 'JWT Authentication Enabled'
    jwt_strict_validation:
      type: boolean
      label: 'Strict Token Validation'
    jwt_token_limit_per_user:
      type: integer
      label: 'Maximum Number of Active Refresh Tokens per User'
    jwt_store_tokens:
      type: boolean
      label: 'Store All Tokens in Database'
    jwt_revoke_tokens_on_password_change:
      type: boolean
      label: 'Remove All Tokens on Password Change'
    otp:
      type: mapping
      label: 'OTP Authentication Settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enable OTP Authentication'
        length:
          type: integer
          label: 'OTP Code Length'
        expiry:
          type: integer
          label: 'OTP Expiration Time (seconds)'
        max_attempts:
          type: integer
          label: 'Maximum Verification Attempts'
        rate_limit:
          type: integer
          label: 'Rate Limit (requests per hour)'
        message_template:
          type: string
          label: 'SMS Message Template'
        user_phone_field:
          type: string
          label: 'User Phone Number Field'
        default_role:
          type: string
          label: 'Default Role for New Users'
        username_prefix:
          type: string
          label: 'Username Prefix for New Users'
