tvet_rest.api_docs:
  path: '/api/docs'
  defaults:
    _controller: '\Drupal\tvet_rest\Controller\OpenApiController::stoplightDocs'
  requirements:
    _permission: 'access content'

tvet_rest.api_docs_swagger:
  path: '/api/docs/swagger'
  defaults:
    _controller: '\Drupal\tvet_rest\Controller\OpenApiController::documentation'
    _title: 'API Documentation (Swagger UI)'
  requirements:
    _permission: 'access content'

tvet_rest.api_docs_json:
  path: '/api/docs/json'
  defaults:
    _controller: '\Drupal\tvet_rest\Controller\OpenApiController::spec'
    _title: 'OpenAPI Specification'
  requirements:
    _permission: 'access content'

tvet_rest.app_services:
  path: '/admin/config/app-services'
  defaults:
    _controller: '\Drupal\tvet_rest\Controller\AppServicesController::overview'
    _title: 'App Services'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
