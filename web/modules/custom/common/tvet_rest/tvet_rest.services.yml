services:
  plugin.manager.paragraph_mapper:
    class: Drupal\tvet_rest\Plugin\ParagraphMapperManager
    parent: default_plugin_manager

  tvet_rest.field_mapper:
    class: Drupal\tvet_rest\Service\TvetRestFieldMapper
    arguments: ['@tvet_rest.paragraph_mapper_manager', '@entity_type.manager', '@file_url_generator', '@language_manager', '@path_alias.manager']

  cache_context.path_header:
    class: Drupal\tvet_rest\Cache\Context\PathHeaderCacheContext
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }

  cache_context.language_header:
    class: Drupal\tvet_rest\Cache\Context\LanguageHeaderCacheContext
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }

  tvet_rest.cache_contexts_subscriber:
    class: Drupal\tvet_rest\EventSubscriber\TvetRestCacheContextsSubscriber
    tags:
      - { name: event_subscriber }

  tvet_rest.paragraph_mapper_manager:
    class: Drupal\tvet_rest\Plugin\ParagraphMapperManager
    parent: default_plugin_manager

  # OpenAPI schema provider plugin manager
  plugin.manager.openapi_schema_provider:
    class: Drupal\tvet_rest\Plugin\OpenApiSchemaProviderManager
    parent: default_plugin_manager

  # REST exception subscriber - handles all REST API error responses
  tvet_rest.rest_exception_subscriber:
    class: Drupal\tvet_rest\EventSubscriber\TvetRestExceptionSubscriber
    arguments: ['@logger.factory', '@router.route_provider']
    tags:
      - { name: event_subscriber }

  tvet_rest.openapi_schema:
    class: Drupal\tvet_rest\Service\OpenApiSchemaService
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@cache.default'
      - '@router.route_provider'
      - '@plugin.manager.paragraph_mapper'
      - '@entity_field.manager'
      - '@entity_type.bundle.info'
      - '@tvet_rest.field_mapper'
      - '@plugin.manager.openapi_schema_provider'
      - '@service_container'

  # DTO Factory service
  tvet_rest.dto_factory:
    class: Drupal\tvet_rest\DTO\Factory\DtoFactory
    arguments: ['@logger.factory']

parameters:
  # http.response.debug_cacheability_headers: true
  # Define the required cache contexts as a single parameter
  tvet_rest.required_cache_contexts: ['languages:language_interface', 'theme', 'user.permissions', 'path_header', 'language_header', 'url.query_args', 'url.site', 'headers.x-path', 'headers.x-language']
