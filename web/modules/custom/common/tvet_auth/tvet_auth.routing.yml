tvet_auth.settings:
  path: '/admin/config/app-services/tvet-auth'
  defaults:
    _form: '\Drupal\tvet_auth\Form\TvetAuthSettingsForm'
    _title: 'API Authentication'
  requirements:
    _permission: 'administer site configuration'

tvet_auth.token_management:
  path: '/admin/config/app-services/tvet-auth/tokens'
  defaults:
    _controller: '\Drupal\tvet_auth\Controller\TokenManagementController::overview'
    _title: 'JWT Token Management'
  requirements:
    _permission: 'administer site configuration'

tvet_auth.token_revoke:
  path: '/admin/config/app-services/tvet-auth/tokens/{token_id}/revoke'
  defaults:
    _form: '\Drupal\tvet_auth\Form\TokenRevokeForm'
    _title: 'Revoke JWT Token'
  requirements:
    _permission: 'administer site configuration'
  options:
    parameters:
      token_id: 
        type: integer 

tvet_auth.token_revoke_all:
  path: '/admin/config/app-services/tvet-auth/tokens/revoke-all'
  defaults:
    _form: '\Drupal\tvet_auth\Form\TokenRevokeAllForm'
    _title: 'Revoke All JWT Tokens'
  requirements:
    _permission: 'administer site configuration'
