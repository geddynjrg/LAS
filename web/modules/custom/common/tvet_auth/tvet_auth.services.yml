services:
  # JWT token storage service
  tvet_auth.token_storage:
    class: Drupal\tvet_auth\Service\TokenStorageService
    arguments: ['@database', '@logger.factory', '@request_stack', '@config.factory']

  # JWT service
  tvet_auth.jwt_service:
    class: Drupal\tvet_auth\Service\TvetJwtService
    arguments: ['@config.factory', '@entity_type.manager', '@tvet_auth.token_storage']

  cache.tvet_auth:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: [tvet_auth]

  # JWT authentication provider
  authentication.jwt:
    class: Drupal\tvet_auth\Authentication\Provider\JwtAuthProvider
    arguments: ['@tvet_auth.jwt_service', '@config.factory', '@entity_type.manager', '@current_user', '@logger.factory']
    tags:
      - { name: authentication_provider, provider_id: 'jwt_auth', priority: 100 }

  # JWT CSRF Decorator - extends the core CSRF access check service
  access_check.header.csrf:
    class: Drupal\tvet_auth\Access\JwtCsrfDecorator
    arguments: ['@session_configuration', '@csrf_token', '@authentication.jwt']
    tags:
      - { name: access_check, applies_to: _csrf_request_header_token }
