tvet_auth.settings:
  type: config_object
  label: 'TVET Auth settings'
  mapping:
    jwt_secret:
      type: string
      label: 'JWT Secret Key'
    jwt_refresh_secret:
      type: string
      label: 'JWT Refresh Secret Key'  
    jwt_expiration:
      type: integer
      label: 'JWT Access Token Expiration Time'
    jwt_refresh_expiration:
      type: integer
      label: 'JWT Refresh Token Expiration Time'
    jwt_auth_enabled:
      type: boolean
      label: 'JWT Authentication Enabled'
    jwt_strict_validation:
      type: boolean
      label: 'Strict Token Validation'
    jwt_token_limit_per_user:
      type: integer
      label: 'Maximum Number of Active Refresh Tokens per User'
    jwt_store_tokens:
      type: boolean
      label: 'Store All Tokens in Database'
    jwt_revoke_tokens_on_password_change:
      type: boolean
      label: 'Remove All Tokens on Password Change' 